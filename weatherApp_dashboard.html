<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg1:#dbe9f6;--bg2:#f4f8fc;--ink:#15293f;--mute:#5d7287;--card:rgba(255,255,255,.72);--line:rgba(21,41,63,.12);--accent:#e8743b;--rain:#3b82c4}
@media (prefers-color-scheme:dark){:root{--bg1:#0d1b2e;--bg2:#162a44;--ink:#e8f0f8;--mute:#9bb0c6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--accent:#ff9a62;--rain:#6fb1ee}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:20px}
body.night{--bg1:#0d1b2e;--bg2:#1b3050;--ink:#e8f0f8;--mute:#9bb0c6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--accent:#ff9a62;--rain:#6fb1ee}
main{max-width:1000px;margin:0 auto}
header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1;min-width:220px}
input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.units{display:flex;gap:4px}
#sug{position:absolute;left:0;right:0;top:100%;margin:6px 0 0;padding:4px;list-style:none;background:var(--bg2);border:1px solid var(--line);border-radius:12px;z-index:5;display:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#sug li{padding:10px 12px;border-radius:8px;cursor:pointer}
#sug li:hover,#sug li:focus{background:var(--card)}
#sug small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;backdrop-filter:blur(8px)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-bottom:16px}
.place{font-size:1.1rem;color:var(--mute);margin:0}
.temp{font-size:clamp(4rem,12vw,7rem);font-weight:800;line-height:1;margin:8px 0;letter-spacing:-.04em}
.cond{font-size:1.3rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start}
.stat{border-left:3px solid var(--accent);padding-left:10px}
.stat b{display:block;font-size:1.25rem}.stat span{color:var(--mute);font-size:.85rem}
h2{font-size:1rem;margin:0 0 12px;font-weight:600;color:var(--mute)}
.chart{height:260px;position:relative}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}
.day{text-align:center;padding:12px 4px;border-radius:12px;border:1px solid var(--line)}
.day .ic{font-size:1.8rem}.day .n{font-weight:600}.day .r{color:var(--rain);font-size:.8rem}
.day .hi{font-weight:600}.day .lo{color:var(--mute)}
#msg{padding:40px;text-align:center;color:var(--mute)}
@media(max-width:720px){.hero{grid-template-columns:1fr}.days{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){.days{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<header>
  <div class="search">
    <input id="q" type="search" placeholder="Search for a city…" autocomplete="off" aria-label="Search for a city">
    <ul id="sug" role="listbox"></ul>
  </div>
  <button id="loc" title="Use my location">My location</button>
  <div class="units">
    <button id="uC" class="on">°C</button><button id="uF">°F</button>
  </div>
</header>
<div id="msg">Loading forecast…</div>
<div id="app" hidden>
  <section class="card hero">
    <div>
      <p class="place" id="place"></p>
      <div class="temp" id="temp"></div>
      <p class="cond" id="cond"></p>
    </div>
    <div class="stats" id="stats"></div>
  </section>
  <section class="card">
    <h2>Next 24 hours</h2>
    <div class="chart"><canvas id="hourly"></canvas></div>
  </section>
  <section class="card" style="margin-top:16px">
    <h2>7-day outlook</h2>
    <div class="chart"><canvas id="daily"></canvas></div>
    <div class="days" id="days"></div>
  </section>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
const WMO = {0:['Clear sky','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','❄️'],75:['Heavy snow','❄️'],77:['Snow grains','🌨️'],80:['Showers','🌦️'],81:['Showers','🌧️'],82:['Violent showers','⛈️'],85:['Snow showers','🌨️'],86:['Snow showers','❄️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm, hail','⛈️'],99:['Thunderstorm, hail','⛈️']};
const wmo = c => WMO[c] || ['Unknown','❔'];
let state = { place: null, unit: 'C', charts: {} };
try { const s = JSON.parse(localStorage.getItem('wx')); if (s) { state.place = s.place; state.unit = s.unit || 'C'; } } catch (e) {}
if (!state.place) state.place = { name: 'London', country: 'United Kingdom', latitude: 51.5072, longitude: -0.1276 };

function save() { try { localStorage.setItem('wx', JSON.stringify({ place: state.place, unit: state.unit })); } catch (e) {} }

async function load() {
  const { latitude, longitude } = state.place, F = state.unit === 'F';
  $('uC').classList.toggle('on', !F); $('uF').classList.toggle('on', F);
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + latitude + '&longitude=' + longitude +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,pressure_msl,is_day' +
    '&hourly=temperature_2m,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max' +
    '&timezone=auto&temperature_unit=' + (F ? 'fahrenheit' : 'celsius') + '&wind_speed_unit=' + (F ? 'mph' : 'kmh');
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('Forecast service returned ' + r.status);
    render(await r.json());
  } catch (e) {
    $('app').hidden = true; $('msg').hidden = false;
    $('msg').textContent = 'Could not load the forecast (' + e.message + '). Check your connection and try again.';
  }
}

function render(d) {
  const c = d.current, u = state.unit === 'F' ? ['°F', 'mph'] : ['°C', 'km/h'];
  $('msg').hidden = true; $('app').hidden = false;
  document.body.classList.toggle('night', !c.is_day);
  $('place').textContent = state.place.name + (state.place.country ? ', ' + state.place.country : '');
  $('temp').textContent = Math.round(c.temperature_2m) + u[0];
  $('cond').textContent = wmo(c.weather_code)[1] + ' ' + wmo(c.weather_code)[0];
  const stats = [['Feels like', Math.round(c.apparent_temperature) + u[0]], ['Humidity', c.relative_humidity_2m + '%'],
    ['Wind', Math.round(c.wind_speed_10m) + ' ' + u[1]], ['Pressure', Math.round(c.pressure_msl) + ' hPa'],
    ['UV today', Math.round(d.daily.uv_index_max[0])], ['Rain today', d.daily.precipitation_probability_max[0] + '%']];
  $('stats').innerHTML = stats.map(s => '<div class="stat"><b>' + s[1] + '</b><span>' + s[0] + '</span></div>').join('');

  // Hourly chart: next 24h starting at the current local hour
  let i = d.hourly.time.findIndex(t => t.slice(0, 13) === c.time.slice(0, 13)); if (i < 0) i = 0;
  const hrs = d.hourly.time.slice(i, i + 24).map(t => t.slice(11, 16));
  const css = getComputedStyle(document.body), accent = css.getPropertyValue('--accent').trim(), rain = css.getPropertyValue('--rain').trim(), mute = css.getPropertyValue('--mute').trim();
  const grid = { color: 'rgba(128,128,128,.15)' }, ticks = { color: mute };
  draw('hourly', {
    data: { labels: hrs, datasets: [
      { type: 'line', label: 'Temperature (' + u[0] + ')', data: d.hourly.temperature_2m.slice(i, i + 24), borderColor: accent, backgroundColor: accent, tension: .4, pointRadius: 0, yAxisID: 'y' },
      { type: 'bar', label: 'Chance of rain (%)', data: d.hourly.precipitation_probability.slice(i, i + 24), backgroundColor: rain + '88', yAxisID: 'y1' }] },
    scales: { y: { grid, ticks }, y1: { position: 'right', min: 0, max: 100, grid: { display: false }, ticks }, x: { grid: { display: false }, ticks: { color: mute, maxTicksLimit: 8 } } }
  });

  // Daily chart + cards
  const days = d.daily.time.map(t => new Date(t + 'T12:00').toLocaleDateString(undefined, { weekday: 'short' }));
  days[0] = 'Today';
  draw('daily', {
    data: { labels: days, datasets: [
      { type: 'line', label: 'High', data: d.daily.temperature_2m_max, borderColor: accent, backgroundColor: accent, tension: .3 },
      { type: 'line', label: 'Low', data: d.daily.temperature_2m_min, borderColor: rain, backgroundColor: rain, tension: .3 }] },
    scales: { y: { grid, ticks }, x: { grid: { display: false }, ticks } }
  });
  $('days').innerHTML = d.daily.time.map((t, k) => '<div class="day"><div class="n">' + days[k] + '</div><div class="ic" title="' + wmo(d.daily.weather_code[k])[0] + '">' + wmo(d.daily.weather_code[k])[1] + '</div><div><span class="hi">' + Math.round(d.daily.temperature_2m_max[k]) + '°</span> <span class="lo">' + Math.round(d.daily.temperature_2m_min[k]) + '°</span></div><div class="r">' + d.daily.precipitation_probability_max[k] + '% rain</div></div>').join('');
}

function draw(id, cfg) {
  if (state.charts[id]) state.charts[id].destroy();
  Chart.defaults.font.family = "'Bricolage Grotesque',system-ui,sans-serif";
  state.charts[id] = new Chart($(id), { data: cfg.data, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { labels: { color: getComputedStyle(document.body).getPropertyValue('--mute').trim(), boxWidth: 12 } } }, scales: cfg.scales } });
}

// Location search (Open-Meteo geocoding)
let timer;
$('q').addEventListener('input', e => {
  clearTimeout(timer);
  const v = e.target.value.trim();
  if (v.length < 2) { $('sug').style.display = 'none'; return; }
  timer = setTimeout(async () => {
    try {
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&name=' + encodeURIComponent(v));
      const j = await r.json(), res = j.results || [];
      $('sug').innerHTML = res.length ? res.map((p, k) => '<li tabindex="0" data-k="' + k + '">' + esc(p.name) + ' <small>' + esc([p.admin1, p.country].filter(Boolean).join(', ')) + '</small></li>').join('') : '<li>No matches found</li>';
      $('sug').style.display = 'block';
      $('sug').onclick = $('sug').onkeydown = ev => {
        const li = ev.target.closest('li[data-k]'); if (!li || (ev.type === 'keydown' && ev.key !== 'Enter')) return;
        const p = res[li.dataset.k];
        pick({ name: p.name, country: p.country, latitude: p.latitude, longitude: p.longitude });
      };
    } catch (err) { $('sug').style.display = 'none'; }
  }, 300);
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('sug').style.display = 'none'; });
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
function pick(p) { state.place = p; $('q').value = ''; $('sug').style.display = 'none'; save(); load(); }

$('loc').onclick = () => {
  if (!navigator.geolocation) return alert('Geolocation is not supported in this browser.');
  navigator.geolocation.getCurrentPosition(
    p => pick({ name: 'Your location', country: '', latitude: p.coords.latitude, longitude: p.coords.longitude }),
    () => alert('Location access was denied. Search for a city instead.'));
};
$('uC').onclick = () => { state.unit = 'C'; save(); load(); };
$('uF').onclick = () => { state.unit = 'F'; save(); load(); };
load();
</script>
</body>
</html>
